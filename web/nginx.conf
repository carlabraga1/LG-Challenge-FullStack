server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every unknown path serves index.html so the client-side
  # tab state survives a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy /api/* to the API container. The rewrite strips the /api prefix
  # so the API sees clean paths like /movies/by-title.
  # `api` resolves via Docker's built-in DNS to the service defined in
  # docker-compose.yml.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}
